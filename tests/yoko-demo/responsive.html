<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>横のエレベーター・表示幅の確認</title>
<style>body{margin:24px;font:16px system-ui;background:#e8ece8;color:#193d30}label{margin-right:20px}select{font:inherit;padding:8px}iframe{display:block;margin-top:20px;width:390px;height:844px;border:1px solid #6c8278;background:white}p{line-height:1.7}</style>
<h1>デモの表示幅を確認</h1><p>実際のデモを小さな表示領域に表示します。端末そのものの試験とは異なります。</p>
<label>表示幅 <select id="width"><option value="390">390 px</option><option value="320">320 px</option><option value="768">768 px</option><option value="1280">1280 px</option></select></label>
<label>表示高さ <select id="height"><option value="844">844 px</option><option value="667">667 px</option><option value="960">960 px</option></select></label>
<label>入口 <select id="role"><option value="user">ユーザー用</option><option value="driver">ドライバー用</option><option value="admin">管理者用</option><option value="">共通入口</option></select></label>
<button id="reload" type="button">デモを再読込</button>
<iframe id="preview" title="横のエレベーターのデモ" src="../../danchi-elevator/demo/?role=user&amp;preview=0.16.0"></iframe>
<script>'use strict';document.getElementById('width').addEventListener('change',event=>{document.getElementById('preview').style.width=event.target.value+'px';});document.getElementById('height').addEventListener('change',event=>{document.getElementById('preview').style.height=event.target.value+'px';});function reloadDemo(){const role=document.getElementById('role').value;document.getElementById('preview').src='../../danchi-elevator/demo/?preview='+Date.now()+(role?'&role='+role:'');}document.getElementById('role').addEventListener('change',reloadDemo);document.getElementById('reload').addEventListener('click',reloadDemo);</script>
</html>
