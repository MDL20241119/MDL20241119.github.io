<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>MDL 表示確認</title><style>body{margin:20px;background:#ddd;color:#111;font:14px Arial,sans-serif}header{display:flex;gap:15px;flex-wrap:wrap;align-items:center;margin-bottom:20px}select,button{font:inherit;padding:12px}#frames{display:flex;gap:25px;align-items:start}figure{margin:0}figcaption{margin-bottom:8px}iframe{height:900px;border:1px solid #111;background:#f8f7f3;display:block}#checks{background:#fff;padding:15px;white-space:pre-wrap;margin-top:20px}</style></head><body><header><label>確認ページ<select id="page"><option value="../">トップ</option><option value="../mobility-training/">全国比較</option><option value="../evidence/">Evidence</option><option value="../danchi-elevator/">横のエレベーター</option><option value="../danchi-elevator/standards/">技術Evidence</option></select></label><button id="inspect">幅・画像・主要要素を確認</button><p>Chromiumのiframeによる幅別確認。実機端末の検証とは異なります。</p></header><main id="frames"></main><pre id="checks" role="status"></pre><script>const widths=[320,390,768,1440];function render(){document.querySelector('#frames').replaceChildren(...widths.map(w=>{const f=document.createElement('figure'),c=document.createElement('figcaption'),i=document.createElement('iframe');c.textContent=w+'px';i.width=w;i.title=w+'pxの表示';i.src=document.querySelector('#page').value;f.append(c,i);return f;}));document.querySelector('#checks').textContent='読込後に確認ボタンを押してください。';}document.querySelector('#page').addEventListener('change',render);document.querySelector('#inspect').addEventListener('click',()=>{const result=[...document.querySelectorAll('iframe')].map(f=>{try{const d=f.contentDocument;return {width:Number(f.width),page:f.src,overflow:d.documentElement.scrollWidth>d.documentElement.clientWidth,documentWidth:d.documentElement.scrollWidth,viewport:d.documentElement.clientWidth,h1:d.querySelector('h1')?.innerText,brokenImages:[...d.images].filter(x=>x.complete&&!x.naturalWidth).map(x=>x.getAttribute('src'))};}catch{return {width:f.width,error:'document not available'};}});document.querySelector('#checks').textContent=JSON.stringify(result,null,2);});render();</script></body></html>
