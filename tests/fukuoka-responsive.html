<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>福岡交通データ・表示確認</title>
<style>body{margin:16px;background:#eee;color:#111;font:14px sans-serif}label{display:inline-block;margin:0 16px 12px 0}select{font:inherit;padding:8px}iframe{display:block;border:1px solid #555;background:white;height:850px;max-width:none}p{font-size:13px}</style>
<label>ページ<select id="page">
<option value="index.html">ホーム</option><option value="index.html#map">運行地図</option><option value="accessibility.html">目的地</option><option value="transport-gaps.html">交通空白・送迎</option><option value="lab.html#example">増便体験</option><option value="data-catalog.html">データカタログ</option><option value="index.html#bc">費用便益</option>
</select></label>
<label>表示幅<select id="width"><option value="390">390px</option><option value="320">320px</option><option value="768">768px</option><option value="1280">1280px</option><option value="1440">1440px</option></select></label>
<p>公開ページを指定幅で確認する開発用画面です。端末固有の挙動を再現するものではありません。</p>
<iframe id="preview" title="福岡交通データの表示確認" width="390" src="../fukuoka-mobility/index.html"></iframe>
<script>
const frame=document.getElementById('preview');
document.getElementById('page').addEventListener('change',e=>{frame.src='../fukuoka-mobility/'+e.target.value;});
document.getElementById('width').addEventListener('change',e=>{frame.style.width=e.target.value+'px';});
</script>
</html>
