<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>大分アトラス表示確認</title><style>body{font:16px sans-serif;background:#eee;margin:20px}label{margin-right:20px}button,select{font:inherit;padding:8px}iframe{display:block;border:1px solid #111;background:white;margin-top:16px;height:850px}output{display:block;margin-top:15px;white-space:pre-wrap}</style></head><body><h1>大分アトラス表示確認</h1><label>ページ<select id="page"><option value="index.html">PEOPLE</option><option value="atlas.html">ATLAS</option><option value="policy.html">LAB</option><option value="transport-gaps.html">交通空白</option></select></label><label>幅<select id="width"><option>320</option><option>375</option><option selected>390</option><option>430</option><option>768</option><option>1440</option></select></label><button id="inspect">幅と読み込みを確認</button><output id="result">読み込み中</output><iframe title="大分アトラス確認画面" id="view" width="390" src="../oita-mobility/index.html?release=20260922.8"></iframe><script>
const view=document.getElementById('view'),result=document.getElementById('result');
document.getElementById('page').onchange=e=>{view.src='../oita-mobility/'+e.target.value+'?release=20260922.8';result.textContent='読み込み中'};
document.getElementById('width').onchange=e=>{view.width=e.target.value;result.textContent='幅を変更しました'};
document.getElementById('inspect').onclick=()=>{const d=view.contentDocument;const date=d.querySelector('#quick-date'),walk=d.querySelector('#quick-walk'),box=d.querySelector('.time-gap-filters'),map=d.querySelector('#map'),metrics=d.querySelector('.gap-metrics'); let filters=null;if(date&&walk&&box){box.closest('details').open=true;const a=date.getBoundingClientRect(),b=walk.getBoundingClientRect(),outer=box.getBoundingClientRect();filters={overlap:a.left<b.right&&b.left<a.right&&a.top<b.bottom&&b.top<a.bottom,stacked:a.bottom<=b.top,inBounds:a.left>=outer.left-1&&b.left>=outer.left-1&&a.right<=outer.right+1&&b.right<=outer.right+1,mapFirst:!!(map&&metrics&&map.compareDocumentPosition(metrics)&4)};}const errors=[...d.querySelectorAll('[role=alert]')].filter(e=>!e.hidden).map(e=>e.textContent);result.textContent=JSON.stringify({page:document.getElementById('page').value,viewport:view.contentWindow.innerWidth,documentWidth:d.documentElement.scrollWidth,ready:d.documentElement.dataset.atlasReady==='true',overflow:d.documentElement.scrollWidth>view.contentWindow.innerWidth,filters,errors},null,2)};
</script></body></html>
