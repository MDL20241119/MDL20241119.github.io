<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#FFF200"><title>SHINAGAWA MEC HUB｜閲覧用パスワード</title><style>*{box-sizing:border-box}body{margin:0;background:#EFE9D8;color:#111;font-family:system-ui,sans-serif;min-height:100dvh;display:grid;place-items:center;padding:24px}main{width:min(650px,100%);border:1px solid #111;background:#FFF200;padding:clamp(24px,5vw,48px)}small{font-weight:800}h1{font-size:clamp(36px,7vw,64px);line-height:.95;letter-spacing:-.05em;margin:28px 0}h2{font-size:22px;line-height:1.5}label{display:block;font-weight:800;margin:28px 0 8px}input{width:100%;border:1px solid #111;padding:14px;font:inherit;border-radius:0;background:white}button{width:100%;margin-top:12px;padding:16px;background:#111;color:white;border:1px solid #111;font:inherit;font-weight:800;cursor:pointer}button:disabled{opacity:.6}input:focus-visible,button:focus-visible{outline:3px solid #263BFF;outline-offset:3px}#status{min-height:3em;font-size:14px;line-height:1.6}footer{font-size:12px;border-top:1px solid;padding-top:16px;line-height:1.7}</style></head><body><main><small>ROUTE 15 / DISCUSSION DRAFT</small><h1>SHINAGAWA<br>MEC HUB.</h1><h2>品川駅前・国道15号上空デッキ構想</h2><form id="unlock"><label for="password">閲覧用パスワード</label><input id="password" name="password" type="password" autocomplete="current-password" required autofocus><button id="submit" type="submit">資料を開く →</button><p id="status" role="status" aria-live="polite"></p></form><footer>資料は暗号化されています。パスワードは送信・保存しません。<br>共有端末では、閲覧後にタブを閉じてください。</footer></main><script>
'use strict';const form=document.getElementById('unlock'),input=document.getElementById('password'),button=document.getElementById('submit'),status=document.getElementById('status');const bytes=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));form.addEventListener('submit',async e=>{e.preventDefault();button.disabled=true;status.textContent='資料を開いています…';try{if(!globalThis.crypto?.subtle)throw Error('unsupported');const response=await fetch('presentation.enc.json',{cache:'no-cache'});if(!response.ok)throw Error('network');const data=await response.json();const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(input.value),'PBKDF2',false,['deriveKey']);const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:bytes(data.salt),iterations:data.iterations,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt']);let decoded;try{decoded=await crypto.subtle.decrypt({name:'AES-GCM',iv:bytes(data.iv)},key,bytes(data.ciphertext));}catch{throw Error('password');}input.value='';const html=new TextDecoder().decode(decoded);document.open();document.write(html);document.close();}catch(error){status.textContent=error.message==='password'?'パスワードが違います。もう一度入力してください。':error.message==='unsupported'?'このブラウザーでは開けません。最新版のSafariまたはChromeをご利用ください。':'資料を読み込めませんでした。通信を確認して、もう一度お試しください。';input.focus();button.disabled=false;}});
</script></body></html>
