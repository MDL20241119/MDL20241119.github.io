<text x="40" y="38" font-size="22" font-weight="700" fill="#111111" text-anchor="start">REGION / 海峡を越えて、滞在する</text>
<text x="1138" y="38" font-size="19" font-weight="500" fill="#111111" text-anchor="end">交通の接続図・縮尺なし・途中駅を省略</text>
