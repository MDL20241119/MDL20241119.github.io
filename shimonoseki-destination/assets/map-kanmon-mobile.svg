<path d="M498 359 V630" fill="none" stroke="white" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M498 359 V630" fill="none" stroke="#1892F5" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="34" y="68" width="313" height="97" rx="0" fill="white" stroke="#111111" stroke-width="2"/>
<text x="54" y="101" font-size="22" font-weight="500" fill="#111111" text-anchor="start">新幹線の入口</text>
<text x="54" y="144" font-size="36" font-weight="900" fill="#111111" text-anchor="start">新下関駅</text>
<rect x="149" y="187" width="59.2" height="43" rx="2" fill="#F5F5EE" stroke="#111111" stroke-width="0"/>
<text x="163" y="213" font-size="26" font-weight="700" fill="#111111" text-anchor="start">JR</text>
<rect x="25" y="249" width="305" height="131" rx="0" fill="#FFE248" stroke="#111111" stroke-width="2.5"/>
<text x="45" y="288" font-size="36" font-weight="900" fill="#111111" text-anchor="start">下関駅前</text>
<text x="45" y="325" font-size="21" font-weight="500" fill="#111111" text-anchor="start">大丸営業終了後の構想拠点</text>
<text x="45" y="357" font-size="22" font-weight="500" fill="#111111" text-anchor="start">夜の食と文化・宿泊連携案</text>
<rect x="345" y="225" width="124" height="41" rx="2" fill="#F5F5EE" stroke="#111111" stroke-width="0"/>
<text x="359" y="249" font-size="24" font-weight="700" fill="#111111" text-anchor="start">路線バス</text>
<rect x="407" y="297" width="208" height="91" rx="0" fill="white" stroke="#111111" stroke-width="2"/>
<text x="427" y="333" font-size="34" font-weight="900" fill="#111111" text-anchor="start">唐戸</text>
<text x="427" y="369" font-size="25" font-weight="500" fill="#111111" text-anchor="start">市場・港</text>
<text x="184" y="468" font-size="41" font-weight="900" fill="white" text-anchor="start">関門海峡</text>
<rect x="161" y="526" width="152.8" height="43" rx="2" fill="white" stroke="#111111" stroke-width="0"/>
<text x="175" y="552" font-size="26" font-weight="700" fill="#111111" text-anchor="start">JR 在来線</text>
