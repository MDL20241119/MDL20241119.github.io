<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1090" viewBox="0 0 640 1090" role="img" aria-labelledby="title desc"><title id="title">関門広域のアクセシビリティ</title><desc id="desc">関門を一体で巡る交通接続の模式図。新下関駅と下関駅はJR山陽本線、下関駅と唐戸は既存バス、唐戸港と門司港は既存の関門連絡船。下関駅から海峡を越えて門司駅・小倉駅へJR在来線、門司駅から門司港駅へJR。途中駅やバス停は省略。宿泊や夜の帰路の一体案内は未合意の構想。</desc><g font-family="Noto Sans CJK JP,Noto Sans JP,Hiragino Kaku Gothic ProN,Meiryo,sans-serif" fill="#111111">
<rect x="0" y="0" width="640" height="1090" rx="0" fill="#F5F5EE" stroke="#111111" stroke-width="0"/>
<rect x="0" y="403" width="640" height="224" rx="0" fill="#1892F5" stroke="#111111" stroke-width="0"/>
<text x="23" y="37" font-size="24" font-weight="700" fill="#111111" text-anchor="start">REGION / 海峡を越えて、滞在する</text>
<path d="M130 147 V720 H85 V835" fill="none" stroke="#111111" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
