<rect x="255" y="737" width="148.0" height="42" rx="2" fill="#F5F5EE" stroke="#111111" stroke-width="0"/>
<text x="269" y="762" font-size="25" font-weight="700" fill="#111111" text-anchor="start">JR 在来線</text>
<rect x="32" y="821" width="276" height="82" rx="0" fill="white" stroke="#111111" stroke-width="2"/>
<text x="52" y="872" font-size="38" font-weight="900" fill="#111111" text-anchor="start">小倉駅</text>
<text x="345" y="853" font-size="32" font-weight="900" fill="#111111" text-anchor="start">北九州市</text>
<text x="345" y="885" font-size="20" font-weight="500" fill="#111111" text-anchor="start">門司港・小倉にも泊まる</text>
<rect x="23" y="937" width="594" height="115" rx="0" fill="white" stroke="#EF7BD7" stroke-width="3" stroke-dasharray="11 7"/>
<text x="44" y="975" font-size="26" font-weight="900" fill="#111111" text-anchor="start">連携案 / 宿へ戻るまでをひとつに</text>
<text x="44" y="1010" font-size="22" font-weight="500" fill="#111111" text-anchor="start">下関・門司港・小倉の宿、荷物、夜の帰路。</text>
<text x="44" y="1038" font-size="22" font-weight="500" fill="#111111" text-anchor="start">深夜の船・バス・鉄道の運行は示しません。</text>
</g></svg>
