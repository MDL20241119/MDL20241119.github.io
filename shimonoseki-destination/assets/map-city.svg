<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="820" viewBox="0 0 1180 820" role="img" aria-labelledby="title desc"><title id="title">下関市内のアクセシビリティ</title><desc id="desc">下関駅前と、海響館・唐戸市場・赤間神宮・城下町長府・新下関駅をつなぐ模式図。下関駅から海沿いの各地へ既存バス、新下関駅から下関駅へJR、新下関駅から城下町長府へ既存バス。水色の破線はこれらを周回する未運行の企画案。方位、距離、道路形状は示さない。</desc><g font-family="Noto Sans CJK JP,Noto Sans JP,Hiragino Kaku Gothic ProN,Meiryo,sans-serif" fill="#111111">
