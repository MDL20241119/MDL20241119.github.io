<section id="admin-panel" class="admin-console" aria-label="管理者の運行マップ" hidden>
  <div class="admin-board"><section class="driver-map-panel" aria-labelledby="admin-map-title"><div class="driver-section-heading"><h2 id="admin-map-title">地域の運行マップ</h2><button id="admin-map-fit" class="text-button" type="button">全体を見る ↗</button></div><div class="driver-map-frame"><div id="admin-map" aria-label="地域の依頼を確認する地図"></div><p id="admin-map-error" class="map-error" role="status" hidden>背景地図を読み込めません。チャットか一覧から確認できます。</p></div><p class="driver-map-note">ピンを押すと、その場所の依頼を表示します。地点は架空の設定です。車両位置は未取得です。</p></section>
    <section class="admin-overview" aria-labelledby="admin-now-title"><div class="admin-overview-heading"><h2 id="admin-now-title">いまの状況</h2><span>このブラウザーの記録</span></div><div class="admin-big-metrics"><div><span>引受待ち</span><strong id="admin-waiting-orders">0<small>件</small></strong></div><div><span>乗車を待つ人</span><strong id="admin-waiting-people">0<small>名</small></strong></div></div><p class="admin-metric-note">待つ人 ＝ 引受前 ＋ 迎車中 ＋ 到着後</p><dl class="admin-small-metrics"><div><dt>乗車中</dt><dd id="admin-onboard">0名</dd></div><div><dt>降車完了</dt><dd id="admin-completed">0件</dd></div><div><dt>取消</dt><dd id="admin-cancelled">0件</dd></div></dl><p class="admin-metric-note">完了・取消は取得済みの最新200件に含まれる記録です。</p></section>
  </div>
  <div class="admin-find-grid"><section class="ops-chat admin-chat" aria-labelledby="admin-chat-title"><div class="ops-chat-heading"><h2 id="admin-chat-title">チャットで確認</h2><span>場所・状態・受付番号</span></div><div id="admin-chat-log" class="ops-chat-log" role="log" aria-live="polite" aria-label="管理者の入力履歴"></div><form id="admin-chat-form" class="ops-chat-form"><label class="sr-only" for="admin-chat-input">管理者のチャット入力</label><input id="admin-chat-input" maxlength="100" placeholder="例：処理待ち" autocomplete="off" enterkeyhint="send"><button id="admin-chat-send" type="submit">送信 ↑</button></form><p class="ops-chat-note">「中央広場の依頼」「運行中」「履歴」などで検索。入力で運行状態は変更されません。</p></section>
    <section class="admin-results" aria-labelledby="admin-results-title"><div class="driver-section-heading"><h2 id="admin-results-title">選んだ依頼</h2><button id="admin-show-all" class="text-button" type="button">すべて</button></div><p id="admin-result-label" role="status"></p><div id="admin-result-list"></div></section></div>
  <section class="admin-fleet" aria-labelledby="admin-fleet-title"><div class="admin-fleet-heading"><h2 id="admin-fleet-title">車両ごとの状況</h2><span>確保済み座席と、乗車中の人数を区別</span></div><div id="admin-fleet-list"></div></section>
</section>
