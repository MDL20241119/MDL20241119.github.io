<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">湯布院MECハブと周辺の日常施設をつなぐ構想</title><desc id="desc">西側の由布院郵便局、南側の湯布院庁舎、北東側のコンビニと、食・遊び・交流のハブを一体で考える。矢印は連携検討であり実際の歩行路ではない。</desc><rect width="1200" height="720" rx="16" fill="#f8f4e9"/><g font-family="sans-serif" fill="#172d2b"><text x="40" y="48" font-size="19" font-weight="700">NEIGHBORHOOD / 日常と旅をつなぐ</text><text x="40" y="91" font-size="32" font-weight="700">用事のついでが、食事・交流・まち歩きになる。</text>
<rect x="860" y="125" width="300" height="130" rx="12" fill="#d6edce"/><text x="1010" y="165" text-anchor="middle" font-size="25" font-weight="700">周辺のコンビニ</text><text x="1010" y="202" text-anchor="middle" font-size="20">日用品・飲物などの買物</text><text x="1010" y="233" text-anchor="middle" font-size="18">既存店舗と補完する</text>
<rect x="40" y="285" width="295" height="145" rx="12" fill="#d5eaf1"/><text x="187" y="326" text-anchor="middle" font-size="27" font-weight="700">由布院郵便局</text><text x="187" y="365" text-anchor="middle" font-size="21">郵便・荷物の用事</text><text x="187" y="399" text-anchor="middle" font-size="19">食事や休憩と組み合わせる</text>
<rect x="390" y="270" width="420" height="190" rx="14" fill="#172d2b"/><text x="600" y="312" text-anchor="middle" font-size="22" fill="#d9ff43">MEC HUB / 構想</text><text x="600" y="355" text-anchor="middle" font-size="31" fill="white" font-weight="700">地元の食・遊び・交流</text><text x="600" y="395" text-anchor="middle" font-size="22" fill="white">旅の案内・荷物・移動の相談</text><text x="600" y="431" text-anchor="middle" font-size="20" fill="white">駐車・充電は体験を支える</text>
<text x="347" y="365" font-size="34" fill="#b45b2b">↔</text><path d="M815 275 L855 240" stroke="#b45b2b" stroke-width="4" stroke-dasharray="8 6"/><text x="831" y="302" font-size="17">接続を検討</text>
<rect x="390" y="515" width="420" height="125" rx="12" fill="#e4e0f0"/><text x="600" y="551" text-anchor="middle" font-size="25" font-weight="700">由布市役所 湯布院庁舎</text><text x="600" y="586" text-anchor="middle" font-size="21">ゆふいんラックホール内</text><text x="600" y="619" text-anchor="middle" font-size="19">行政手続き・公共施設利用の前後に</text><text x="587" y="502" font-size="35" fill="#b45b2b">↕</text>
<rect x="865" y="360" width="295" height="200" rx="12" fill="#ffe3c1"/><text x="1012" y="400" text-anchor="middle" font-size="26" font-weight="700">旧商店街・宿へ</text><text x="1012" y="440" text-anchor="middle" font-size="21">案内から、まちの店へ</text><text x="1012" y="475" text-anchor="middle" font-size="20">観光客も住民も行き交う</text><text x="1012" y="515" text-anchor="middle" font-size="19">生活の通行を妨げない</text><text x="820" y="410" font-size="34" fill="#b45b2b">↔</text>
<text x="40" y="676" font-size="18">施設のつながりを描く概念図。方位・距離・道路・敷地境界・出入口・安全な歩行経路を保証しません。</text><text x="40" y="704" font-size="17">施設は現在の場所のまま検討。移設・共同運営・サービス連携の合意を示すものではありません。</text></g></svg>