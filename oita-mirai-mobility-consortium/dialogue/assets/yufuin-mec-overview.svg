<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 690" role="img" aria-labelledby="overview-title overview-desc"><title id="overview-title">食・遊び・交流を楽しむ建物を中心に、町・宿・交通・エネルギーをつなぐ湯布院MECハブ構想</title><desc id="overview-desc">中央の建物に地元の食、遊びと体験、交流と休憩、旅の案内窓口。左から車や公共交通で来訪し、右の旧商店街や宿へ接続する。下部の充電・電源が滞在と移動を支える。配置・位置・規模は未確定。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b45b2b"/></marker></defs><rect width="1200" height="690" rx="12" fill="#f8f4e9"/><g font-family="sans-serif" fill="#172d2b"><text x="48" y="48" font-size="19" font-weight="700" letter-spacing="3">YUFUIN MEC HUB / 全体構想</text><text x="48" y="90" font-size="28" font-weight="700">この建物で過ごす時間も、湯布院を訪れる目的になる。</text><path d="M270 188 L590 126 L910 188" fill="none" stroke="#172d2b" stroke-width="8"/><rect x="280" y="188" width="620" height="325" rx="9" fill="#fff" stroke="#172d2b" stroke-width="4"/><text x="590" y="226" font-size="25" font-weight="700" text-anchor="middle">食べる・遊ぶ・人と出会う建物</text><rect x="302" y="250" width="180" height="137" rx="7" fill="#ffe3c1"/><text x="392" y="292" text-anchor="middle" font-size="30" font-weight="700">地元の食</text><text x="392" y="327" text-anchor="middle" font-size="20">食事・おやつ</text><text x="392" y="356" text-anchor="middle" font-size="20">作り手に出会う</text><rect x="500" y="250" width="180" height="137" rx="7" fill="#d6edce"/><text x="590" y="292" text-anchor="middle" font-size="30" font-weight="700">遊び・体験</text><text x="590" y="327" text-anchor="middle" font-size="20">親子で楽しむ</text><text x="590" y="356" text-anchor="middle" font-size="20">季節の催し</text><rect x="698" y="250" width="180" height="137" rx="7" fill="#e4e0f0"/><text x="788" y="292" text-anchor="middle" font-size="30" font-weight="700">交流・休憩</text><text x="788" y="327" text-anchor="middle" font-size="20">住民も立ち寄る</text><text x="788" y="356" text-anchor="middle" font-size="20">心地よく過ごす</text><rect x="302" y="407" width="576" height="83" rx="7" fill="#172d2b"/><text x="590" y="441" text-anchor="middle" font-size="25" fill="#fff" font-weight="700">旅の窓口：案内・荷物・宿送迎の確認</text><text x="590" y="473" text-anchor="middle" font-size="19" fill="#fff">行きたい場所と、帰る時間から一緒に考える</text><rect x="30" y="245" width="210" height="100" rx="8" fill="#fff" stroke="#172d2b" stroke-width="2"/><text x="135" y="281" text-anchor="middle" font-size="25" font-weight="700">車で訪れる</text><text x="135" y="315" text-anchor="middle" font-size="19">駐車して、建物へ</text><rect x="30" y="390" width="210" height="100" rx="8" fill="#fff" stroke="#172d2b" stroke-width="2"/><text x="135" y="427" text-anchor="middle" font-size="24" font-weight="700">駅・バスから</text><text x="135" y="461" text-anchor="middle" font-size="19">既存交通と徒歩</text><path d="M240 295 H277 M240 440 H298" stroke="#b45b2b" stroke-width="5" marker-end="url(#arrow)"/><rect x="950" y="245" width="220" height="100" rx="8" fill="#fff" stroke="#172d2b" stroke-width="2"/><text x="1060" y="281" text-anchor="middle" font-size="25" font-weight="700">旧商店街・店</text><text x="1060" y="315" text-anchor="middle" font-size="19">食・買物・まち歩き</text><rect x="950" y="390" width="220" height="100" rx="8" fill="#fff" stroke="#172d2b" stroke-width="2"/><text x="1060" y="427" text-anchor="middle" font-size="25" font-weight="700">旅館・ホテル</text><text x="1060" y="461" text-anchor="middle" font-size="19">宿送迎・荷物の接続</text><path d="M902 295 H945 M882 448 H945" stroke="#b45b2b" stroke-width="5" marker-start="url(#arrow)" marker-end="url(#arrow)"/><rect x="280" y="542" width="620" height="83" rx="8" fill="#d5eaf1"/><text x="590" y="575" text-anchor="middle" font-size="25" font-weight="700">Energy：滞在中の充電・電源を検討</text><text x="590" y="607" text-anchor="middle" font-size="19">移動と場を支える設備。容量・管理・防災利用は要確認。</text><path d="M590 542 V515" stroke="#172d2b" stroke-width="4"/><text x="48" y="662" font-size="18">機能の関係図です。位置・距離・建物の形・部屋配置・階数・規模を決めた設計図ではありません。</text></g></svg>