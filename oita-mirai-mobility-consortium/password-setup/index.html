<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; connect-src 'none'; form-action 'none'; base-uri 'none'"><title>MDL 閲覧パスワードの設定</title><style>body{margin:0;background:#f7ecee;color:#111;font:16px/1.8 -apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}main{max-width:620px;margin:30px auto;padding:28px;border:2px solid #111;box-sizing:border-box}h1{font-size:28px;line-height:1.4;margin:14px 0}small{font-size:13px;line-height:1.7;color:#51474a}.mark{font:900 48px/1 Arial}label{display:block;font-weight:700;margin-top:14px}input[type=password]{box-sizing:border-box;width:100%;padding:12px;font-size:20px;border:1px solid #111;background:#fff}button{width:100%;padding:14px;margin-top:12px;border:1px solid #111;background:#111;color:white;font:700 16px/1.5 sans-serif;cursor:pointer}button:disabled{opacity:.5}#status{min-height:1.8em;font-size:14px;color:#8b2724}.ack{font-size:13px;font-weight:400;display:flex;gap:10px;align-items:start}.ack input{margin-top:7px}@media(max-width:650px){main{margin:16px;padding:22px}h1{font-size:25px}}</style><script defer src="./crypto.js"></script><script defer src="./setup.js"></script></head><body><main><span class="mark">O.</span><h1>MDLの閲覧用パスワードを設定</h1><p>この入口専用のパスワードを2回入力してください。作成後、入口へ反映します。</p><small>入力した文字そのものは、このブラウザ内で処理され、送信・保存されません。作成する照合用の設定だけをMDLの公開ページに配置します。本文・PDF・写真の直リンクは閲覧可能なままです。ほかのサービスのパスワードは使わないでください。</small><form autocomplete="off" novalidate><label for="password">新しい閲覧用パスワード</label><input id="password" type="password" autocomplete="off" minlength="4" maxlength="128" required><label for="confirmation">同じパスワードをもう一度</label><input id="confirmation" type="password" autocomplete="off" minlength="4" maxlength="128" required><label class="ack"><input id="accept" type="checkbox" required><span>この入口専用のパスワードを使い、照合用の設定が公開されることを確認しました。</span></label><p id="status" role="status" aria-live="polite"></p><button type="submit">このパスワードで設定を作成</button></form></main></body></html>
