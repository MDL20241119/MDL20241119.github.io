<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1000" viewBox="0 0 1200 1000" role="img" aria-labelledby="title desc"><title id="title">盈進学園 東野高等学校のキャンパス設計の仕組み</title><desc id="desc">公開資料に基づく説明図。実景写真や地理的配置ではなく、インプットからアウトカムまでの読み方を示す。</desc><rect width="1200" height="1000" fill="#f4f0e7"/><g font-family="sans-serif" font-weight="700"><text x="54" y="61" font-size="26">MDL / CASE 104 / EVIDENCE-LINKED DIAGRAM</text><text x="54" y="124" font-size="38" fill="#151515">盈進学園 東野高等学校のキャンパス設計</text><rect x="54" y="210" width="1092" height="135" fill="#fff" stroke="#151515" stroke-width="3"/><text x="78" y="257" font-size="27">INPUT</text><text x="78" y="298" font-size="23">インプット</text><line x1="345" y1="233" x2="345" y2="322" stroke="#151515" stroke-width="2"/><text x="375" y="266" font-size="34" fill="#151515">学校の日常と要求</text><path d="M600 349v23m-10-10 10 10 10-10" fill="none" stroke="#151515" stroke-width="4"/><rect x="54" y="380" width="1092" height="135" fill="#eb69ce" stroke="#151515" stroke-width="3"/><text x="78" y="427" font-size="27">FUNCTION</text><text x="78" y="468" font-size="23">価値創造機能</text><line x1="345" y1="403" x2="345" y2="492" stroke="#151515" stroke-width="2"/><text x="375" y="436" font-size="34" fill="#151515">パタンと現地検討</text><path d="M600 519v23m-10-10 10 10 10-10" fill="none" stroke="#151515" stroke-width="4"/><rect x="54" y="550" width="1092" height="135" fill="#fff080" stroke="#151515" stroke-width="3"/><text x="78" y="597" font-size="27">OUTPUT</text><text x="78" y="638" font-size="23">アウトプット</text><line x1="345" y1="573" x2="345" y2="662" stroke="#151515" stroke-width="2"/><text x="375" y="606" font-size="34" fill="#151515">高校キャンパス</text><path d="M600 689v23m-10-10 10 10 10-10" fill="none" stroke="#151515" stroke-width="4"/><rect x="54" y="720" width="1092" height="135" fill="#d7e7ff" stroke="#151515" stroke-width="3"/><text x="78" y="767" font-size="27">OUTCOME</text><text x="78" y="808" font-size="23">アウトカム</text><line x1="345" y1="743" x2="345" y2="832" stroke="#151515" stroke-width="2"/><text x="375" y="776" font-size="34" fill="#151515">1985年開校</text><text x="54" y="951" font-size="24">公開資料からMDLが整理した模式図。因果効果の証明ではありません。</text></g></svg>