<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img"><title>街へサービス空間を届ける</title><desc>Woven Cityで、飲食・エンタメなどを提供する車両基盤として活用。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#38889b"/></marker></defs><rect width="960" height="540" fill="#e8f5f3"/><g font-family="Arial, Noto Sans JP, sans-serif"><text x="42" y="43" text-anchor="start" fill="#386578" font-size="20" font-weight="700"><tspan x="42" dy="0">EP-019  /  用途図解  /  実証</tspan></text><text x="42" y="99" text-anchor="start" fill="#173e54" font-size="34" font-weight="800"><tspan x="42" dy="0">街へサービス空間を届ける</tspan></text><text x="42" y="147" text-anchor="start" fill="#386578" font-size="21" font-weight="500"><tspan x="42" dy="0">静岡県裾野市・Woven City</tspan></text><path d="M304 416.0 L341 264.0" fill="none" stroke="#38889b" stroke-width="3" marker-end="url(#arrow)"/><path d="M480.0 361 L480.0 327" fill="none" stroke="#38889b" stroke-width="3" marker-end="url(#arrow)"/><path d="M612 264.0 L649 416.0" fill="none" stroke="#38889b" stroke-width="3" marker-end="url(#arrow)"/><rect x="24" y="361" width="280" height="110" rx="16" fill="#fff" stroke="#8ebcc2" stroke-width="2"/><circle cx="48" cy="386" r="14" fill="#235571"/><text x="48" y="392" text-anchor="middle" fill="#fff" font-size="17" font-weight="700"><tspan x="48" dy="0">1</tspan></text><text x="164.0" y="426" text-anchor="middle" fill="#173e54" font-size="26" font-weight="500"><tspan x="164.0" dy="0">飲食・移動販売</tspan></text><rect x="348" y="208" width="264" height="112" rx="16" fill="#fff" stroke="#8ebcc2" stroke-width="2"/><circle cx="372" cy="233" r="14" fill="#235571"/><text x="372" y="239" text-anchor="middle" fill="#fff" font-size="17" font-weight="700"><tspan x="372" dy="0">2</tspan></text><text x="480.0" y="273" text-anchor="middle" fill="#173e54" font-size="26" font-weight="500"><tspan x="480.0" dy="0">サービス提供