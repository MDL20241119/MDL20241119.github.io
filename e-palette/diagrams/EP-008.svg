<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img"><title>シャトルを昼の売店に換装</title><desc>昼は売店、その前後は人を運ぶ用途で同じ車両を使う。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#38889b"/></marker></defs><rect width="960" height="540" fill="#e8f5f3"/><g font-family="Arial, Noto Sans JP, sans-serif"><text x="42" y="43" text-anchor="start" fill="#386578" font-size="20" font-weight="700"><tspan x="42" dy="0">EP-008  /  用途図解  /  実証</tspan></text><text x="42" y="99" text-anchor="start" fill="#173e54" font-size="34" font-weight="800"><tspan x="42" dy="0">シャトルを昼の売店に換装</tspan></text><text x="42" y="147" text-anchor="start" fill="#386578" font-size="21" font-weight="500"><tspan x="42" dy="0">福岡県宮若市・宮田工場</tspan></text><path d="M312.0 316.0 L333.0 316.0" fill="none" stroke="#38889b" stroke-width="3" marker-end="url(#arrow)" marker-start="url(#arrow)"/><path d="M620.0 316.0 L641.0 316.0" fill="none" stroke="#38889b" stroke-width="3" marker-end="url(#arrow)" marker-start="url(#arrow)"/><rect x="32.0" y="240" width="280.0" height="152" rx="16" fill="#fff" stroke="#8ebcc2" stroke-width="2"/><circle cx="56.0" cy="265" r="14" fill="#235571"/><text x="56.0" y="271" text-anchor="middle" fill="#fff" font-size="17" font-weight="700"><tspan x="56.0" dy="0">1</tspan></text><text x="172.0" y="305" text-anchor="middle" fill="#173e54" font-size="26" font-weight="500"><tspan x="172.0" dy="0">出退勤シャトル</tspan></text><rect x="340.0" y="240" width="280.0" height="152" rx="16" fill="#fff" stroke="#8ebcc2" stroke-width="2"/><circle cx="364.0" cy="265" r="14" fill="#235571"/><text x="364.0" y="271" text-anchor="middle" fill="#fff" font-size="17" font-weight="700"><tspan x="364.0" dy="0">2</tspan></text><text x="480.0" y="305" text-anchor="middle" fill="#173e54" font-size="26" font-weight="500"><tspan x="480.0" dy="0">棚・レジを換装</tspan></text><rect x="648.0" y="240"